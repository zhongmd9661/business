<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>招待费凭证上传 - 智能审计系统</title>
    <!-- 使用 Tailwind CSS 用于快速构建专业 UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 使用 Alpine.js 处理前端交互逻辑 -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .upload-slot { transition: all 0.3s ease; }
        .upload-slot:hover { border-color: #2563eb; background-                color: #eff6ff; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-900">

    <div class="max-w-5xl mx-auto py-12 px-4" x-data="uploadManager()">
        <!-- 页面头部 -->
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-800">招待费凭证上传</h1>
            <p class="mt-2 text-gray-600">请在下方 9 个槽位中上传对应的业务凭证（如发票、转账记录、报销单等）</p>
        </div>

        <!-- 上传控制栏 -->
        <div class="mb-6 flex justify-between items-center bg-white p-4 rounded-lg shadow-sm">
            <div class="text-sm text-gray-500">
                已上传: <span class="font-bold text-blue-600" x-text="uploadedCount()"></span> / 9
            </div>
            <div class="space-x-3">
                <button @click="clearAll()" class="px-4 py-2 text-sm font-medium text-red-600 hover:bg-red-50 rounded-md transition">
                    清空所有
                </button>
                <button @click="submitAll()" :disabled="uploadedCount() === 0"
                        class="px-6 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-md disabled:opacity-50 disabled:cursor-not-allowed shadow-md transition">
                    开始智能审核
                </button>
            </div>
        </div>

        <!-- 9 个上传槽位网格 (3x3) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <template x-for="(slot, index) in slots" :key="index">
                <div
                    class="upload-slot relative bg-white border-2 border-dashed border-gray-300
                           rounded-xl p-6 flex flex-col items-center justify-center min-h-[180px] cursor-pointer"
                    :class="{ 'border-blue-500 bg-blue-50': slot.file, 'border-gray-300': !slot.file }"
                    @dragover.prevent="slot.isDragging = true"
                    @dragleave.prevent="slot.isDragging = false"
                    @drop.prevent="handleDrop(index, $event)"
                    @click="triggerFileInput(index)"
                >
                    <!-- 隐藏的 Input -->
                    <input type="file" :id="'file-input-' + index" class="hidden" @change="handleFileSelect(index, $event)">

                    <!-- 空状态视图 -->
                    <template x-if="!slot.file">
                        <div class="text-center" x-cloak>
                            <div class="mx-auto w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center mb-3">
                                <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            </div>
                            <span class="text-sm font-medium text-gray-500" x-text="'槽位 ' + (index + 1)"></span>
                        </div>
                    </template>

                    <!-- 已上传文件视图 -->
                    <template x-if="slot.file">
                        <div class="w-full text-center" x-cloak>
                            <!-- 文件图标/预览 -->
                            <div class="mb-3 flex justify-center">
                                <template x-if="slot.isPreview">
                                    <img :src="slot.previewUrl" class="h-16 w-16 object-cover rounded shadow-sm">
                                </template>
                                <template x-if="!slot.isPreview">
                                    <div class="h-16 w-16 bg-blue-100 rounded-full flex items-center justify-center">
                                        <svg class="w-8 h-8 text-blue-500" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"></path></svg>
                                    </div>
                                </template>
                            </div>
                            <!-- 文件信息 -->
                            <div class="px-2">
                                <p class="text-xs font-semibold text-gray-800 truncate" x-text="slot.file.name"></p>
                                <p class="text-[10px] text-gray-500 mt-1" x-text="formatSize(slot.file.size)"></p>
                            </div>
                            <!-- 删除按钮 -->
                            <button @click.stop="removeFile(index)" class="absolute top-2 right-2 p-1 text-gray-400 hover:text-red-500 transition">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
                            </button>
                        </div>
                    </template>

                    <!-- 拖拽提示遮罩 -->
                    <div x-show="slot.isDragging" class="absolute inset-0 bg-blue-500/10 rounded-xl flex items-center justify-center pointer-events-none">
                        <span class="text-blue-600 font-bold">放下文件</span>
                    </div>
                </div>
            </template>
        </div>

        <!-- 底部说明 -->
        <div class="mt-12 grid grid-cols-1 md:grid-cols-2 gap-8 text-sm text-gray-500 border-t pt-8">
            <div>
                <h3 class="font-bold text-gray-700 mb-2">上传规范说明：</h3>
                <ul class="list-disc list-inside space-y-1">
                    <li>支持图片格式 (JPG, PNG) 及 PDF 文档</li>
                    <li>单文件大小建议不超过 10MB</li>
                    <li>请确保凭证内容清晰、完整，无遮挡</li>
                </ul>
            </div>
            <div class="md:text-right">
                <p>由 招待费智能体 (Expense Agent) 提供技术支持</p>
                <p class="mt-1 text-xs italic">Powered by Intelligent Audit Engine</p>
            </div>
        </div>
    </div>

    <script>
        function uploadManager() {
            return {
                slots: Array.from({ length: 9 }, () => ({
                    file: null,
                    previewUrl: null,
                    isPreview: false,
                    isDragging: false
                })),

                uploadedCount() {
                    return this.slots.filter(s => s.file !== null).length;
                },

                triggerFileInput(index) {
                    document.getElementById(`file-input-${index}`).click();
                },

                handleFileSelect(index, event) {
                    const file = event.target.files[0];
                    if (file) this.processFile(index, file);
                },

                handleDrop(index, event) {
                    const file = event.dataTransfer.files[0];
                    this.slots[index].isDragging = false;
                    if (file) this.processFile(index, file);
                },

                processFile(index, file) {
                    const slot = this.slots[index];
                    slot.file = file;

                    if (file.type.startsWith('image/')) {
                        slot.isPreview = true;
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            slot.previewUrl = e.target.result;
                        };
                        reader.readAsDataURL(file);
                    } else {
                        slot.isPreview = false;
                        slot.previewUrl = null;
                    }
                },

                removeFile(index) {
                    this.slots[index].file = null;
                    this.slots[index].previewUrl = null;
                    this.slots[index].isPreview = false;
                },

                clearAll() {
                    if (confirm('确定要清空所有已上传的凭证吗？')) {
                        this.slots.forEach(s => {
                            s.file = null;
                            s.previewUrl = null;
                            s.isPreview = false;
                        });
                    }
                },

                submitAll() {
                    alert('正在将 ' + this.uploadedCount() + ' 个文件发送至智能体进行审核...');
                },

                formatSize(bytes) {
                    if (bytes === 0) return '0 B';
                    const k = 1024;
                    const sizes = ['B', 'KB', 'MB', 'GB'];
                    const i = Math.floor(Math.log(bytes) / Math.log(k));
                    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
                }
            }
        }
    </script>
</body>
</html>
